name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Fixture WAV/noise beds stay local (not in git); skip intakeFixtures binary checks.
      - name: Vitest (outbox + tickets + lib)
        run: >
          npx vitest run
          src/lib/outbox
          src/lib/tickets
          src/lib/signupValidation.test.ts
          src/lib/frameGate.test.ts
          src/lib/realtimeIntakeStages.test.ts
          src/lib/photoAnalysis.test.ts
          src/lib/intakeFixtureScore.test.ts
